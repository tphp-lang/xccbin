name: build

# xcc 发行包 CI：多 host 打包 + 真机验证
#   windows-x86_64  : LLVM 官方预编译包（--fetch-llvm）+ 原生驱动
#   linux-x64       : apt clang（XCC_LLVM_DIR）+ 原生驱动
#   linux-arm64     : ubuntu-24.04-arm 原生 runner，同上
#   macos-arm64     : brew llvm（XCC_LLVM_DIR）+ 原生驱动
# 所有 host 都做同一件事：采集 sysroot -> xccverify 全量回归 -> 打包 -> 包内冒烟测试。
# 驱动 = 底座 clang++ 现场编译 xcc.cpp（全静态），目标机零依赖。
#
# 两点提速/纠偏（2026-09-08）：
#   1) Collect 加 actions/cache 缓存 cache/ + sysroot/（按 pins 哈希，精确命中），
#      xccsysroot 对"已采集"的 target 直接跳过，windows 上不再每次重下重解包（曾 13 分钟）。
#   2) Windows 的 Verify 复用 release 已用 MinGW clang 编好的原生驱动
#      （复制到 build/xcc.exe），并把官方 LLVM 注入 PATH/XCC_LLVM_DIR；
#      否则 xccverify 会现场用官方 LLVM clang（Windows 走 MSVC 目标、缺链接器）
#      重编驱动，必然失败。

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # 打 tag 时上传 Release 附件

env:
  TARGETS: "aarch64-linux-musl x86_64-linux-musl riscv64-linux-musl wasm32-wasi"

jobs:
  release:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            os: windows-latest
          - name: linux-x64
            os: ubuntu-latest
          - name: linux-arm64
            os: ubuntu-24.04-arm
          - name: macos-arm64
            os: macos-14

    steps:
      - uses: actions/checkout@v4

      # ---- LLVM 底座 ----
      - name: Install LLVM (linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm libcurl4-openssl-dev zlib1g-dev liblzma-dev zstd
          # apt llvm 资源目录归 root；ensure_wasm_builtins 需要把 wasm builtins
          # 落位到资源目录（驱动持有跨版本 4 布局知识，不放 CI 重复）。
          # CI 是一次性环境，放开写权限无安全顾虑。
          sudo chmod -R a+w "$(clang -print-resource-dir)"
          echo "XCC_LLVM_DIR=$(dirname $(dirname $(readlink -f $(which clang))))" >> "$GITHUB_ENV"
        shell: bash

      - name: Install LLVM (macos)
        if: startsWith(matrix.os, 'macos')
        run: |
          brew install llvm lld xz
          LLVM_PREFIX=$(brew --prefix llvm)
          echo "XCC_LLVM_DIR=$LLVM_PREFIX" >> "$GITHUB_ENV"
          # brew 的 llvm / lld 默认不进 PATH；clang 链接 musl / wasm 时需要
          # ld.lld / wasm-ld，故把两者的 bin 显式加入 PATH。驱动本身通过
          # XCC_LLVM_DIR 定位 clang，PATH 仅用于 ld.lld 等链接器探测。
          echo "$LLVM_PREFIX/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix lld)/bin" >> "$GITHUB_PATH"
        shell: bash

      # 采集器是 C++ 程序，Windows 上需要 MinGW 工具链（MSVC 版 clang 拿不到 zlib/liblzma 静态库）
      - name: Install MinGW toolchain (windows)
        if: matrix.os == 'windows-latest'
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: false
          install: >-
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-zlib
            mingw-w64-clang-x86_64-xz

      # ---- 编译 C++ 工具 ----
      # Windows 走 msys2 shell：setup-msys2 把 clang64 装在 PATH 上，
      # build-tools.sh 的 find_cxx() 用 command -v clang++ 取到，避免写死 C:\msys64 路径
      # （默认 release:true 把 MSYS2 装到临时目录，C:\msys64\clang64 在 CI 上并不存在）。
      # linux/macos 用 bash：apt/brew 装的 clang 本就在 PATH 上，且那些 runner 没注册 msys2 shell。
      - name: Build C++ tools (windows, msys2 shell)
        if: matrix.os == 'windows-latest'
        run: sh tools/build-tools.sh
        shell: msys2 {0}

      - name: Build C++ tools (linux/macos)
        if: "!startsWith(matrix.os, 'windows')"
        run: sh tools/build-tools.sh
        shell: bash

      # ---- 下载/解包缓存 ----
      # 把 cache/（锁定包）与 sysroot/（已解包）按 pins 哈希缓存，
      # 避免每次 CI 重新下载 + NTFS 上大量小文件解包（windows 上曾耗时 13 分钟）。
      # 仅精确命中（不给 restore-keys）：pins 一变即失效、强制重采，保证可复现。
      - name: Cache sysroot
        uses: actions/cache@v4
        with:
          path: |
            cache
            sysroot
          key: sysroot-${{ runner.os }}-${{ hashFiles('pins/**') }}

      # ---- sysroot 采集（遵守 pins/*.json 锁定）----
      # 二进制名探测：windows 上是 build/xccsysroot.exe（MINGW 产出），其余平台无后缀。
      # 显式相对路径不触发 msys2 的 .exe 自动补全，故这里实测后缀，避免 127。
      - name: Collect sysroots
        run: |
          B=./build/xccsysroot; [ -x "$B.exe" ] && B="$B.exe"
          for t in $TARGETS; do
            echo "=== xccsysroot $t ==="
            "$B" "$t"
          done
        shell: bash

      # ---- 打包（原生 C++ 构建器，替代旧 make_release.py）----
      # Windows 先 --fetch-llvm 拉官方 LLVM：它既是发行底座，也是 verify 步骤需要的 clang。
      # 之后 Export LLVM 把它注入 PATH / XCC_LLVM_DIR。
      - name: Build release (windows, fetch official LLVM)
        if: matrix.os == 'windows-latest'
        run: |
          B=./build/xccrelease; [ -x "$B.exe" ] && B="$B.exe"
          "$B" --fetch-llvm
        # msys2 shell：驱动用 MSYS2 clang（MinGW）编译，which/clang64 路径才可靠；
        # 官方 LLVM 仅作打包底座，其 clang 在 Windows 走 MSVC 目标、bash 下编驱动会失败。
        shell: msys2 {0}

      - name: Build release (linux/macos)
        if: "!startsWith(matrix.os, 'windows')"
        run: |
          B=./build/xccrelease; [ -x "$B.exe" ] && B="$B.exe"
          "$B"
        shell: bash

      # ---- Windows verify 需要官方 LLVM 作底座：导出刚打包的 LLVM 到 PATH/XCC_LLVM_DIR ----
      # 同时复用 release 已用 MinGW clang 编好的原生驱动（复制到 build/xcc.exe），
      # 否则 xccverify 会现场用官方 LLVM clang（Windows 走 MSVC 目标、bash 下缺链接器）
      # 重编 xcc.cpp 驱动，必然失败。验证阶段的 llvm-nm/llvm-readobj 与驱动运行时
      # 交叉编译仍走官方 LLVM。
      - name: Export LLVM for verify (windows)
        if: matrix.os == 'windows-latest'
        run: |
          LLVM_DIR="$PWD/dist/xcc-win64/lib/llvm"
          echo "XCC_LLVM_DIR=$LLVM_DIR" >> "$GITHUB_ENV"
          echo "$LLVM_DIR/bin" >> "$GITHUB_PATH"
          cp -f "$PWD/dist/xcc-win64/bin/xcc.exe" "$PWD/build/xcc.exe"
        shell: bash

      # ---- 全量回归 ----
      - name: Verify all targets
        run: |
          B=./build/xccverify; [ -x "$B.exe" ] && B="$B.exe"
          "$B" --all
        shell: bash

      # ---- 包内冒烟测试（干净 PATH，解压即用） ----
      - name: Smoke test release (windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Expand-Archive dist/xcc-win64.zip -DestinationPath smoketest
          $env:PATH = "$PWD/smoketest/xcc-win64/bin;$env:PATH"
          xcc -print-targets
          xcc -target aarch64-linux-musl tests/hello.c -o smoke_a64.exe
          xcc++ -target wasm32-wasi tests/plain.cpp -o smoke_wasm.exe
          echo "smoke ok"

      - name: Smoke test release (linux/macos)
        if: "!startsWith(matrix.os, 'windows')"
        shell: bash
        run: |
          python -c "import zipfile,os; zipfile.ZipFile('dist/$(ls dist | grep -E "^xcc-.*\.zip$" | head -1)').extractall('smoketest')"
          d=$(find smoketest -maxdepth 1 -type d -name "xcc-*" | head -1)
          # Python 3.14 的 extractall 默认 filter='data' 会剥离 zip 内 Unix 权限位，
          # 导致 bin/xcc、lib/llvm/bin/* 等失去执行位而 "Permission denied"。
          # 显式补回执行权限（Windows 包靠 .exe 扩展名不受影响）。
          find "$d" -type f \( -path '*/bin/*' -o -name '*.sh' \) -exec chmod +x {} + || true
          export PATH="$PWD/$d/bin:$PATH"
          xcc -print-targets
          xcc -target aarch64-linux-musl tests/hello.c -o smoke_a64
          xcc++ -target wasm32-wasi tests/plain.cpp -o smoke_wasm
          # linux runner 无 qemu 跑不了 aarch64 产物，但可以原生跑本机架构：
          xcc -target x86_64-linux-musl tests/hello.c -o smoke_native 2>/dev/null || true
          if [ "$(uname -m)" = "x86_64" ] && [ -f smoke_native ]; then ./smoke_native; fi
          echo "smoke ok"

      # ---- 产物 ----
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: xcc-${{ matrix.name }}
          path: dist/*.zip

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
